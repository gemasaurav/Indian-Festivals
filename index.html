<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Indian Festivals – आइए सब मिलकर मनाएँ</title>
  <style>
    :root {
      --saffron: #FF9933;
      --white: #FFFFFF;
      --green: #138808;
      --navy: #000080;
      --gold: #FFD700;
      --pink: #FF69B4;
      --purple: #8A2BE2;
      --red: #DC143C;
      --orange: #FF4500;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Devanagari', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #2d1b4e 40%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .page {
      display: none;
      min-height: 100vh;
      padding-bottom: 110px;
      width: 100%;
    }
    .page.active {
      display: block;
      animation: pageSlideIn 0.28s ease-out;
    }
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===== FRONT ===== */
    #front {
      text-align: center;
      padding: 40px 20px 100px;
      background: linear-gradient(160deg, #FF9933 0%, #FF4500 25%, #8A2BE2 55%, #138808 85%, #000080 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #front h1 {
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      font-weight: 800;
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #FFD700, #fff, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #front .tagline {
      font-size: 1.15rem;
      opacity: 0.95;
      margin-bottom: 28px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .pic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 340px;
      margin: 0 auto 32px;
    }
    .pic-grid span {
      font-size: 2.4rem;
      background: rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 12px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      animation: bounce 2.5s infinite ease-in-out;
    }
    .pic-grid span:nth-child(2) { animation-delay: 0.2s; }
    .pic-grid span:nth-child(3) { animation-delay: 0.4s; }
    .pic-grid span:nth-child(4) { animation-delay: 0.6s; }
    .pic-grid span:nth-child(5) { animation-delay: 0.1s; }
    .pic-grid span:nth-child(6) { animation-delay: 0.3s; }
    .pic-grid span:nth-child(7) { animation-delay: 0.5s; }
    .pic-grid span:nth-child(8) { animation-delay: 0.7s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #FFD700, #FF9933);
      color: #1a0533;
      box-shadow: 0 6px 20px rgba(255,215,0,0.4);
    }
    .btn:active { transform: scale(0.96); }

    /* ===== INDEX ===== */
    #index header {
      background: linear-gradient(90deg, #FF9933, #DC143C, #8A2BE2);
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #index header h2 { font-size: 1.45rem; font-weight: 800; }
    #index header p { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }

    .search-box {
      padding: 12px 14px 8px;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255,255,255,0.15);
      color: #fff;
      outline: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.6); }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .festival-list {
      list-style: none;
      padding: 8px 12px 20px;
      max-width: 560px;
      margin: 0 auto;
    }
    .festival-list li {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .festival-list li:active { background: rgba(255,255,255,0.2); transform: scale(0.98); }
    .festival-list .emoji { font-size: 1.9rem; min-width: 42px; text-align: center; }
    .festival-list .info { flex: 1; }
    .festival-list .name { font-weight: 700; font-size: 1.08rem; }
    .festival-list .meta { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }
    .festival-list .arrow { font-size: 1.2rem; opacity: 0.6; }
    .no-result {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.7;
      font-size: 1.05rem;
    }

    /* ===== DETAIL ===== */
    #detail header {
      background: linear-gradient(90deg, #8A2BE2, #DC143C, #FF9933);
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
    #detail header h2 { font-size: 1.35rem; font-weight: 800; }
    #detail .content {
      padding: 16px 16px 30px;
      max-width: 600px;
      margin: 0 auto;
    }
    .detail-card {
      background: rgba(255,255,255,0.09);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      border-left: 5px solid var(--gold);
    }
    .detail-card h3 {
      font-size: 0.95rem;
      color: #FFD700;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .detail-card p {
      font-size: 0.98rem;
      line-height: 1.55;
      opacity: 0.95;
    }
    .hero-emoji {
      text-align: center;
      font-size: 4.2rem;
      margin: 10px 0 18px;
      text-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 10, 40, 0.97);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px 8px;
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 50;
    }
    .bottom-nav .btn-row {
      display: flex;
      width: 100%;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 6px;
    }
    .bottom-nav button {
      flex: 1;
      max-width: 160px;
      padding: 11px 10px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0 6px;
    }
    .btn-next {
      background: linear-gradient(90deg, #FF9933, #FFD700);
      color: #1a0533;
    }
    .btn-close {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25) !important;
    }
    #index .bottom-nav .btn-row { justify-content: center; }
    #index .btn-close { max-width: 200px; }
    .footer-credit {
      width: 100%;
      text-align: center;
      font-size: 0.68rem;
      opacity: 0.75;
      padding: 2px 4px;
      color: #ddd;
    }
    #front .footer-credit {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      opacity: 0.85;
      z-index: 40;
    }
  </style>
</head>

  </div>

let currentIndex = 0;

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
    p.style.display = 'none';
  });
  const target = document.getElementById(pageId);
  target.style.display = 'block';
  target.classList.add('active');
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  if (pageId === 'index') {
    document.getElementById('searchInput').value = '';
    renderList(festivals);
  }
}

function renderList(list) {
  const ul = document.getElementById('festivalList');
  if (!list || list.length === 0) {
    ul.innerHTML = '<div class="no-result">कोई त्योहार नहीं मिला 🔍</div>';
    return;
  }
  ul.innerHTML = list.map((f) => {
    const realIndex = festivals.findIndex(x => x.id === f.id);
    return `
    <li onclick="openFestival(${realIndex})">
      <span class="emoji">${f.emoji}</span>
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="meta">${f.date} · ${f.community}</div>
      </div>
      <span class="arrow">›</span>
    </li>`;
  }).join('');
}

function filterFestivals() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) {
    renderList(festivals);
    return;
  }
  const filtered = festivals.filter(f =>
    f.name.toLowerCase().includes(q) ||
    f.community.toLowerCase().includes(q) ||
    f.region.toLowerCase().includes(q) ||
    f.date.toLowerCase().includes(q) ||
    (f.why && f.why.toLowerCase().includes(q))
  );
  renderList(filtered);
}

function openFestival(index) {
  currentIndex = index;
  const f = festivals[index];
  document.getElementById('detailTitle').textContent = f.name;
  document.getElementById('detailContent').innerHTML = `
    <div class="hero-emoji">${f.emoji}</div>
    <div class="detail-card"><h3>📅 विशेष तिथि</h3><p>${f.date}</p></div>
    <div class="detail-card"><h3>👥 मुख्यतः कौन मनाता है</h3><p>${f.community}</p></div>
    <div class="detail-card"><h3>🗺️ देश के किस भाग में</h3><p>${f.region}</p></div>
    <div class="detail-card"><h3>❓ क्यों मनाया जाता है</h3><p>${f.why}</p></div>
    <div class="detail-card"><h3>🎉 कैसे मनाया जाता है</h3><p>${f.how}</p></div>
    <div class="detail-card"><h3>📖 पौराणिक कथा / महत्व</h3><p>${f.mythology}</p></div>
    <div class="detail-card"><h3>🗣️ दंतकथाएँ (यदि कोई)</h3><p>${f.dantkatha}</p></div>
  `;
  showPage('detail');
}

// Initial
renderList(festivals);
